        <main>
        <section class="contact-form">
            <h2>計算式</h2>
            <form action="#" method="POST" class="expression-form">
                <dl class="Input">
                    <dt class="Item">値1</dt>
                    <dd><input type="number" id="value1"></dd>
                    <dt class="Item">値2</dt>
                    <dd><input type="number" id="value2"></dd>
                    <dt class="Item">演算子</dt>
                    <select name="choice" id="choice">
                        <option value="addition">足し算</option>
                        <option value="subtraction">引き算</option>
                        <option value="multiplication">掛け算</option>
                        <option value="division">割り算</option>
                    </select>
                </dl>
            </form>
            <p id="expression" class="output">ここに計算式が表示されます</p>
            <p id="result" class="output">ここに結果が表示されます</p>
        </section>
    </main>
